<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>今天我来当大王 · 48H 倒计时</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#04231f;
  --bg-ink:#0a3a33;
  --neon:#d8ff4d;
  --neon-soft:#e9ff8a;
  --amber:#ffb547;
  --line:rgba(216,255,77,.18);
  --line-soft:rgba(216,255,77,.08);
  --txt:#eafff2;
  --txt-dim:#9fd8c3;
  --danger:#ff6a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);color:var(--txt);
  font-family:'Noto Sans SC',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
body{
  background-image:
    radial-gradient(1200px 700px at 20% -10%, rgba(216,255,77,.07), transparent 55%),
    radial-gradient(900px 600px at 90% 110%, rgba(255,120,80,.05), transparent 60%),
    url("assets/bg.jpg");
  background-size:cover;background-position:center;
  position:relative;
}
/* 小妖怪底图水印层 */
.mascot-layer{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.15;
  background-image:url("assets/kv.png");
  background-repeat:no-repeat;
  background-position:85% 85%;
  background-size:min(50vw,600px);
  filter:brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(45deg);
  -webkit-mask-image:linear-gradient(135deg, transparent 10%, black 40%, transparent 85%);
  mask-image:linear-gradient(135deg, transparent 10%, black 40%, transparent 85%);
}
body::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.55) 100%);
  pointer-events:none;z-index:1}
/* 噪点颗粒，模拟胶片/赛博质感 */
body::after{
  content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='1'/></svg>");
}
/* 扫描线（可选，增强黑客松氛围） */
.scanlines{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.15;
  background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(216,255,77,.03) 3px 4px);}
/* 主舞台 */
.stage{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;
  padding:clamp(16px,2.5vw,40px) clamp(20px,3.5vw,56px);}
/* 顶栏 */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:clamp(44px,4.5vw,68px);height:auto;filter:drop-shadow(0 4px 20px rgba(216,255,77,.35))}
.brand-name{font-size:clamp(14px,1.1vw,20px);letter-spacing:.3em;color:var(--neon);font-weight:900}
.brand-sub{font-size:clamp(11px,.8vw,14px);color:var(--txt-dim);letter-spacing:.25em;margin-top:4px}
.top-meta{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.event-tag{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;
  border:1px solid var(--line);border-radius:999px;background:rgba(4,35,31,.6);
  backdrop-filter:blur(10px);font-size:clamp(11px,.85vw,14px);letter-spacing:.2em;color:var(--neon)}
.event-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--neon);
  box-shadow:0 0 12px var(--neon);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(.7)}}
.deadline{font-family:'JetBrains Mono',monospace;font-size:clamp(12px,1vw,16px);
  color:var(--txt-dim);letter-spacing:.15em}
.deadline b{color:var(--neon-soft);font-weight:700}
/* 主区域 */
.hero{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(24px,4vw,80px)}
/* 左侧：巨型数字 */
.timer{display:flex;align-items:center;gap:clamp(12px,1.6vw,28px)}
.seg{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1vw,18px)}
.seg-label{font-size:clamp(11px,.9vw,16px);letter-spacing:.4em;color:var(--txt-dim);font-weight:700}
.digits{display:flex;gap:clamp(6px,.7vw,12px)}
/* 翻牌卡片 */
.flip-card{position:relative;width:clamp(64px,8.5vw,150px);height:clamp(96px,12.5vw,220px);
  perspective:900px;border-radius:clamp(8px,1vw,18px);
  background:linear-gradient(180deg,#0b4a40 0%,#062d27 50%,#04211d 50.5%,#021815 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.08),
    inset 0 -2px 0 rgba(0,0,0,.4),
    0 12px 40px rgba(0,0,0,.5),
    0 0 0 1px var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:900;
  font-size:clamp(56px,9vw,160px);line-height:1;color:var(--neon);
  text-shadow:0 0 30px rgba(216,255,77,.45),0 0 80px rgba(216,255,77,.15);
}
.flip-card::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(0,0,0,.55);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.flip-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 30%,transparent 60%,rgba(0,0,0,.25) 100%)}
.flip-card.hours{color:var(--neon)}
.flip-card.minutes{color:var(--neon-soft)}
.flip-card.seconds{color:var(--amber);text-shadow:0 0 30px rgba(255,181,71,.45)}
.flip-card.danger{color:var(--danger);text-shadow:0 0 30px rgba(255,106,90,.6);
  animation:danger-blink .5s steps(2,end) infinite}
@keyframes danger-blink{50%{opacity:.85}}
/* 秒数快速翻转动画 */
.flip-card.flipping .flip-inner{animation:flip .35s ease-in-out}
.flip-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-style:preserve-3d}
@keyframes flip{
  0%{transform:rotateX(0)}
  50%{transform:rotateX(-90deg)}
  51%{transform:rotateX(90deg)}
  100%{transform:rotateX(0)}
}
.colon{font-family:'JetBrains Mono',monospace;font-weight:900;
  font-size:clamp(48px,7.5vw,130px);color:var(--neon);opacity:.5;line-height:1;
  animation:colon-blink 1s steps(2,end) infinite}
@keyframes colon-blink{50%{opacity:.15}}
/* 右侧：信息与进度环 */
.side{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,2.5vw,36px)}
.ring-wrap{position:relative;width:clamp(200px,22vw,320px);height:clamp(200px,22vw,320px)}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line-soft);stroke-width:10}
.ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;
  filter:drop-shadow(0 0 14px rgba(216,255,77,.5));transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ring-pct{font-family:'Archivo Black','JetBrains Mono',monospace;font-size:clamp(32px,3.4vw,52px);
  color:var(--neon);text-shadow:0 0 24px rgba(216,255,77,.4)}
.ring-caption{font-size:clamp(10px,.85vw,14px);letter-spacing:.35em;color:var(--txt-dim)}
/* 阶段标签 */
.phase{display:flex;align-items:center;gap:14px;padding:10px 22px;
  border:1px solid var(--line);border-radius:12px;background:rgba(6,45,39,.55);
  backdrop-filter:blur(12px);font-size:clamp(12px,1vw,17px);letter-spacing:.2em;color:var(--txt)}
.phase-dot{width:10px;height:10px;border-radius:50%;background:var(--amber);
  box-shadow:0 0 12px var(--amber)}
/* 主KV 角色（右下小点缀） */
.kv-mascot{position:fixed;right:clamp(10px,2vw,40px);bottom:clamp(10px,2vw,40px);z-index:6;
  width:clamp(160px,18vw,320px);opacity:.9;pointer-events:none;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6))}
/* 底部跑马灯 */
.marquee{position:relative;z-index:5;margin-top:8px;
  border-top:1px solid var(--line);padding-top:14px;overflow:hidden}
.marquee-track{display:flex;gap:48px;white-space:nowrap;
  font-family:'JetBrains Mono',monospace;font-size:clamp(11px,.85vw,14px);
  letter-spacing:.3em;color:var(--txt-dim);animation:scroll 30s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.marquee-item{display:inline-flex;align-items:center;gap:10px}
.marquee-item::before{content:"▸";color:var(--neon)}
/* 结束态（隐藏默认显示） */
.end-screen{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;background:rgba(2,18,15,.94);backdrop-filter:blur(20px)}
.end-screen.show{display:flex}
.end-title{font-size:clamp(48px,6vw,110px);font-weight:900;color:var(--neon);
  text-shadow:0 0 60px rgba(216,255,77,.5);letter-spacing:.05em}
.end-sub{font-size:clamp(14px,1.2vw,20px);color:var(--txt-dim);letter-spacing:.4em}
/* 响应式 */
@media (max-width:900px){
  .hero{flex-direction:column;gap:24px}
  .side{flex-direction:row;gap:24px}
  .kv-mascot{width:140px}
  .timer{transform:scale(.9)}
}
@media (max-width:600px){
  .timer{transform:scale(.75)}
  .kv-mascot{display:none}
}
</style>
</head>
<body>

<div class="scanlines"></div>

<div class="stage">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand-name">今天我来当大王</div>
        <div class="brand-sub">西游共创 · 黑客松</div>
      </div>
    </div>
    <div class="top-meta">
      <div class="event-tag">48H 创作冲刺</div>
      <div class="deadline">截止 <b id="deadlineText">2026-11-14 24:00</b></div>
    </div>
  </header>

  <!-- 主区域 -->
  <main class="hero">
    <!-- 左侧：翻牌时钟 -->
    <section class="timer" aria-label="剩余时间">
      <div class="seg">
        <div class="seg-label">时</div>
        <div class="digits">
          <div class="flip-card hours" id="h1"><div class="flip-inner">0</div></div>
          <div class="flip-card hours" id="h2"><div class="flip-inner">0</div></div>
        </div>
      </div>
      <div class="colon">:</div>
      <div class="seg">
        <div class="seg-label">分</div>
        <div class="digits">
          <div class="flip-card minutes" id="m1"><div class="flip-inner">0</div></div>
          <div class="flip-card minutes" id="m2"><div class="flip-inner">0</div></div>
        </div>
      </div>
      <div class="colon">:</div>
      <div class="seg">
        <div class="seg-label">秒</div>
        <div class="digits">
          <div class="flip-card seconds" id="s1"><div class="flip-inner">0</div></div>
          <div class="flip-card seconds" id="s2"><div class="flip-inner">0</div></div>
        </div>
      </div>
    </section>

    <!-- 右侧：进度环 + 阶段 -->
    <aside class="side">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d8ff4d"/>
              <stop offset="60%" stop-color="#e9ff8a"/>
              <stop offset="100%" stop-color="#ffb547"/>
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="100" cy="100" r="88"/>
          <circle class="ring-fg" id="ringFg" cx="100" cy="100" r="88"
                  stroke-dasharray="552.92" stroke-dashoffset="552.92"/>
        </svg>
        <div class="ring-center">
          <div class="ring-pct" id="pct">0%</div>
          <div class="ring-caption">已进行</div>
        </div>
      </div>
      <div class="phase">
        <span class="phase-dot"></span>
        <span id="phaseText">48 小时创作进行中</span>
      </div>
    </aside>
  </main>

  <!-- 底部信息条 -->
  <footer class="marquee" style="border-top:1px solid var(--line);padding-top:14px;overflow:hidden">
    <div style="display:flex;justify-content:center;gap:32px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:clamp(11px,.85vw,14px);letter-spacing:.2em;color:var(--txt-dim)">
      <span>主办 · 悟空智画 OPC 社区</span>
      <span>云游 OPC 社区</span>
      <span>地点 · 连云港</span>
      <span>48H · 创作冲刺</span>
    </div>
  </footer>
</div>

<!-- 主KV 小妖怪点缀 -->
<img class="kv-mascot" src="assets/kv.png" alt="" 
     style="clip-path: inset(38% 0 0 58%); transform: scale(1.1); display:none;"/>

<!-- 全屏按钮 -->
<button id="fsBtn" style="position:fixed;top:16px;right:16px;z-index:99;padding:8px 16px;
  background:rgba(4,35,31,.8);border:1px solid var(--line);border-radius:8px;
  color:var(--neon);font-size:12px;letter-spacing:.2em;cursor:pointer;
  backdrop-filter:blur(10px);font-family:inherit">
  全屏 F
</button>

<!-- 结束画面 -->
<div class="end-screen" id="endScreen">
  <div class="end-title">提交截止</div>
  <div class="end-sub">48 小时创作冲刺已结束</div>
</div>

<script>
(function(){
  // ===== 可配置区 =====
  // 截止时间：改这里就能改终点，页面刷新后生效
  var DEADLINE = new Date('2026-11-14T23:59:59+08:00').getTime();
  // 总时长：48 小时
  var TOTAL_MS = 48 * 60 * 60 * 1000;
  // ===================
  var START_MS = DEADLINE - TOTAL_MS;

  var h1=document.getElementById('h1'), h2=document.getElementById('h2');
  var m1=document.getElementById('m1'), m2=document.getElementById('m2');
  var s1=document.getElementById('s1'), s2=document.getElementById('s2');
  var ringFg=document.getElementById('ringFg');
  var pctEl=document.getElementById('pct');
  var phaseEl=document.getElementById('phaseText');
  var endScreen=document.getElementById('endScreen');
  var C = 2 * Math.PI * 88; // 周长

  // 阶段文案（按剩余时间）
  function phaseText(remainMs){
    var h = remainMs / 3600000;
    if(h > 24) return '48 小时创作进行中';
    if(h > 12) return '白热化阶段';
    if(h > 6)  return '最后 12 小时 · 交付准备';
    if(h > 1)  return '最后 6 小时 · 锁定终版';
    if(h > 0)  return '最后 1 小时 · 提交倒计时';
    return '提交截止';
  }

  function setDigit(card, val){
    var inner = card.querySelector('.flip-inner');
    if(inner.textContent !== String(val)){
      inner.textContent = val;
      card.classList.remove('flipping');
      void card.offsetWidth; // 触发重排
      card.classList.add('flipping');
    }
  }

  function update(){
    var now = Date.now();
    var remain = DEADLINE - now;

    if(remain <= 0){
      h1.querySelector('.flip-inner').textContent='0';
      h2.querySelector('.flip-inner').textContent='0';
      m1.querySelector('.flip-inner').textContent='0';
      m2.querySelector('.flip-inner').textContent='0';
      s1.querySelector('.flip-inner').textContent='0';
      s2.querySelector('.flip-inner').textContent='0';
      ringFg.style.strokeDashoffset = 0;
      pctEl.textContent = '100%';
      phaseEl.textContent = '提交截止';
      endScreen.classList.add('show');
      return;
    }

    // 剩余时间分解：超过 48 小时的部分按 48 小时封顶
    var capped = Math.min(remain, TOTAL_MS);
    var totalSec = Math.floor(capped / 1000);
    var hh = Math.floor(totalSec / 3600);
    var mm = Math.floor((totalSec % 3600) / 60);
    var ss = totalSec % 60;

    var hhStr = String(hh).padStart(2,'0');
    var mmStr = String(mm).padStart(2,'0');
    var ssStr = String(ss).padStart(2,'0');

    setDigit(h1, hhStr[0]); setDigit(h2, hhStr[1]);
    setDigit(m1, mmStr[0]); setDigit(m2, mmStr[1]);
    setDigit(s1, ssStr[0]); setDigit(s2, ssStr[1]);

    // 进度环（已进行百分比）
    var elapsed = now - START_MS;
    var pct = Math.min(100, Math.max(0, (elapsed / TOTAL_MS) * 100));
    var offset = C * (1 - pct / 100);
    ringFg.style.strokeDashoffset = offset;
    pctEl.textContent = Math.floor(pct) + '%';

    // 阶段文案
    phaseEl.textContent = phaseText(remain);

    // 最后 10 分钟：秒表变红并闪烁
    var danger = remain < 10 * 60 * 1000;
    [s1,s2].forEach(function(c){ c.classList.toggle('danger', danger); });
    [m1,m2].forEach(function(c){ c.classList.toggle('danger', danger); });

    requestAnimationFrame(function(){ setTimeout(update, 1000); });
  }

  // 防止漂移：用绝对时间而非累加
  update();

  // 键盘快捷键（现场调试）
  document.addEventListener('keydown', function(e){
    if(e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
    }
    if(e.key === 'r' || e.key === 'R'){
      location.reload();
    }
  });

  // 全屏按钮
  var fsBtn = document.getElementById('fsBtn');
  if(fsBtn){
    fsBtn.addEventListener('click', function(){ toggleFullscreen(); });
  }
  function toggleFullscreen(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  }
})();
</script>
</body>
</html>
